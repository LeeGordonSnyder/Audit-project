<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Oakridge Product Suite: showcase</title>
<style>
  :root { --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #a1a1a6; --accent: #9b4a63; --paper: #f5f5f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  .scene { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; }
  .display { font-family: "Inter Display", "Inter", sans-serif; letter-spacing: -0.02em; }
  .kicker { font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: 0.01em; }
  .kicker.grey { color: #8e8e93; }
  .h1 { font-size: 104px; font-weight: 700; line-height: 1.02; }
  .h2 { font-size: 76px; font-weight: 700; line-height: 1.06; }
  .h3 { font-size: 60px; font-weight: 700; line-height: 1.08; }
  .sub { font-size: 34px; font-weight: 500; color: var(--ink-2); line-height: 1.35; }
  .caption { font-size: 22px; font-weight: 500; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .line { display: block; will-change: transform, opacity; }

  .iphone { position: absolute; left: 0; top: 0; width: 433px; height: 892px; border-radius: 68px; transform-origin: 0 0;
    background: linear-gradient(145deg, #5b5b60, #2c2c2e 40%, #48484a); padding: 20px;
    box-shadow: 0 40px 80px rgba(0,0,0,.18), 0 8px 20px rgba(0,0,0,.12), inset 0 0 0 2px #77777c; }
  .iphone .screen { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #000; position: relative; }
  .iphone .status { height: 54px; background: linear-gradient(90deg, #894554, #ac697f); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0; font-weight: 600; font-size: 17px; }
  .iphone .bat { width: 25px; height: 12px; border: 1.5px solid #fff; border-radius: 4px; padding: 1.5px; } .iphone .bat i { display: block; height: 100%; width: 80%; background: #fff; border-radius: 1.5px; }
  .iphone .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 3; }
  .iphone .shots { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow: hidden; }
  .iphone .shots img { position: absolute; left: 0; top: 0; width: 100%; }
  .iphone .off { position: absolute; inset: 0; background: #0b0b0c; z-index: 2; }
  .iphone .home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.55); z-index: 4; }
  .card { position: absolute; width: 260px; height: 140px; border-radius: 26px; background: #fff; box-shadow: 0 24px 50px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.06); display: flex; flex-direction: column; justify-content: center; padding: 0 26px; }
  .card .n { font-size: 18px; color: var(--accent); font-weight: 700; letter-spacing: .08em; }
  .card .t { font-size: 30px; font-weight: 700; margin-top: 8px; }
  .monitor { position: absolute; left: 0; top: 0; width: 1200px; transform-origin: 0 0; }
  .monitor .panel { background: #1c1c1e; border-radius: 22px; padding: 18px 18px 26px; box-shadow: 0 40px 80px rgba(0,0,0,.16); }
  .monitor .glass { background: #fff; border-radius: 6px; overflow: hidden; aspect-ratio: 16/10; }
  .monitor .glass img { display: block; width: 100%; }
  .monitor .neck { width: 180px; height: 110px; margin: 0 auto; background: linear-gradient(90deg, #d1d1d6, #f2f2f7 50%, #c7c7cc); clip-path: polygon(22% 0, 78% 0, 88% 100%, 12% 100%); }
  .monitor .foot { width: 420px; height: 16px; margin: 0 auto; border-radius: 8px 8px 4px 4px; background: linear-gradient(#e5e5ea, #c7c7cc); }
  .stopwatch-num { font-family: "Inter Display", "Inter", sans-serif; font-weight: 700; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="scenes.js"></script>
</body>
</html>
